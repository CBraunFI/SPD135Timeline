<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seite nicht gefunden – SPD Langenselbold Zeitstrahl</title>
  <style>
    :root{--spd-red:#E3000F;--ink:#111;--bg:#fbfbfb;--muted:#6b7280}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100%;display:flex;align-items:center;justify-content:center;text-align:center}
    main{max-width:600px;padding:40px 20px}
    h1{font-size:48px;color:var(--spd-red);margin:0 0 20px 0}
    p{color:var(--muted);margin:0 0 30px 0}
    a{color:var(--spd-red);text-decoration:none;font-weight:700;padding:12px 24px;border:2px solid var(--spd-red);border-radius:999px;display:inline-block;transition:all .2s}
    a:hover{background:var(--spd-red);color:#fff}
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Die gesuchte Seite wurde nicht gefunden.</p>
    <a href="/">← Zurück zum Zeitstrahl</a>
  </main>
</body>
</html>
